<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>Quản lý sức khoẻ cán bộ - BVĐK khu vực Tuyên Hoá</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--b1:#0b5cab;--b2:#1e88e5;--bg:#eef5fc;--card:#fff;--tx:#16324f;--mu:#5c7391;--bd:#d6e4f2;--soft:#e8f2fc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1a2b;--card:#12263d;--tx:#e6f0fb;--mu:#93aac4;--bd:#24405e;--soft:#183250;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c1a2b;--card:#12263d;--tx:#e6f0fb;--mu:#93aac4;--bd:#24405e;--soft:#183250;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:.3px}header small{opacity:.85}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}nav button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px}nav button.on{background:#fff;color:var(--b1);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.kp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--b2);border-radius:10px;padding:12px}.k b{font-size:26px;color:var(--b1);display:block}.k span{color:var(--mu);font-size:13px}
h2{font-size:16px;margin:0 0 10px;color:var(--b1)}h3{margin:16px 0 8px;font-size:14px;background:var(--soft);padding:6px 10px;border-radius:6px;color:var(--b1)}
input,select,textarea,button{font:inherit;color:var(--tx)}input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
.btn{background:var(--b2);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer}.btn.g{background:var(--soft);color:var(--b1)}.btn.r{background:#d64545}.btn.s{padding:4px 9px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar>*{width:auto;flex:1 1 150px}.bar .btn{flex:0 0 auto}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{background:var(--soft);color:var(--b1)}tr.dp td{background:var(--soft);font-weight:700;color:var(--b1)}
.pl{display:inline-block;min-width:26px;text-align:center;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:700}
.mo{position:fixed;inset:0;background:rgba(5,20,40,.55);display:none;z-index:9;overflow:auto;padding:14px}.mo.on{display:block}.md{background:var(--card);max-width:980px;margin:0 auto;border-radius:14px;padding:18px}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.fg label{font-size:12.5px;color:var(--mu);display:block}.fg .w{grid-column:1/-1}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;justify-content:space-between;flex-wrap:wrap}.bh{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.bh i{flex:0 0 150px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bh div{flex:1;display:flex;height:16px;background:var(--soft);border-radius:8px;overflow:hidden}.bh u{text-decoration:none;display:block;height:100%}.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--c)}
.t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b5cab;color:#fff;padding:9px 18px;border-radius:20px;display:none;z-index:20}
</style></head><body>
<header><svg width="38" height="38" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#fff"/><path d="M16 8h8v8h8v8h-8v8h-8v-8H8v-8h8z" fill="#1e88e5"/></svg>
<div><h1>BỆNH VIỆN ĐA KHOA KHU VỰC TUYÊN HOÁ</h1><small>Quản lý sức khoẻ cán bộ · bvdktuyenhoa.vn</small></div>
<nav id="nav"></nav></header><main id="m"></main><div class="mo" id="mo"><div class="md" id="md"></div></div><div class="t" id="t"></div>
<script>
const SEED=[],DEPTS=[];
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=s=>document.querySelector(s);
const pr=(k,l)=>[[k,l,'text'],[k+'_pl','Phân loại','cls']];
const H22=['Có bệnh hay bị thương trong 5 năm qua','Có bệnh thần kinh hay bị thương ở đầu','Bệnh mắt hoặc giảm thị lực (trừ trường hợp đeo kính thuốc)','Bệnh ở tai, giảm sức nghe hoặc thăng bằng','Bệnh ở tim, hoặc nhồi máu cơ tim, các bệnh tim mạch khác','Phẫu thuật can thiệp tim - mạch','Tăng huyết áp','Khó thở','Bệnh phổi, hen, khí phế thũng, viêm phế quản mạn tính','Bệnh thận, lọc máu','Nghiện rượu, bia','Đái tháo đường hoặc kiểm soát tăng đường huyết','Bệnh tâm thần','Mất ý thức, rối loạn ý thức','Ngất, chóng mặt','Bệnh tiêu hóa','Rối loạn giấc ngủ, ngừng thở khi ngủ, ngủ rũ ban ngày, ngáy to','Tai biến mạch máu não hoặc liệt','Bệnh hoặc tổn thương cột sống','Sử dụng rượu thường xuyên, liên tục','Sử dụng ma túy và chất gây nghiện','Bệnh khác (ghi rõ)'];
const DEF=[
{t:'I. Hành chính',f:[['p.name','Họ và tên','text'],['p.sex','Giới tính','sex'],['p.dob','Ngày, tháng, năm sinh','date'],['age','Tuổi (tự tính)','auto'],['p.cccd','Số CCCD','text'],['cap','Cấp ngày','date'],['noicap','Nơi cấp','text'],['p.eth','Dân tộc','text'],['p.addr','Nơi ở','text'],['job','Nghề nghiệp','text'],['work','Nơi làm việc','text'],['why','Lý do khám','text']]},
{t:'II. Tiền sử',f:[['fam','1. Tiền sử gia đình (truyền nhiễm, tim mạch, đái tháo đường, lao, hen, ung thư, động kinh, tâm thần…)','yn'],['famd','Ghi cụ thể bệnh','text'],...H22.map((l,i)=>['h'+(i+1),'2.'+(i+1)+' '+l,'yn']),['dt','3a. Đang điều trị bệnh gì không?','yn'],['dtd','Tên bệnh, thuốc, liều lượng','text'],['ts','3b. Tiền sử thai sản (nữ)','yn'],['tsd','Ghi cụ thể','text']]},
{t:'III.1 Khám thể lực',f:[['cao','Chiều cao (cm)','num'],['nang','Cân nặng (kg)','num'],['bmi','BMI (tự tính)','bmi'],['mach','Mạch (lần/phút)','num'],['ha','Huyết áp (mmHg)','text'],['tl_pl','Phân loại thể lực','cls']]},
{t:'III.2 Khám lâm sàng - Nội khoa',f:[...pr('tuanhoan','Tuần hoàn'),...pr('hohap','Hô hấp'),...pr('tieuhoa','Tiêu hoá'),...pr('than','Thận - Tiết niệu - Sinh dục'),...pr('noitiet','Nội tiết'),...pr('coxuong','Cơ - Xương - Khớp'),...pr('thankinh','Thần kinh'),...pr('tamthan','Tâm thần')]},
{t:'III.3 Ngoại khoa - Da liễu - Sản phụ khoa',f:[...pr('ngoai','Ngoại khoa'),...pr('dalieu','Da liễu'),...pr('sanphu','Sản phụ khoa')]},
{t:'III.4 Mắt',f:[['mkp','Không kính: Mắt phải','text'],['mkt','Không kính: Mắt trái','text'],['mcp','Có kính: Mắt phải','text'],['mct','Có kính: Mắt trái','text'],...pr('matb','Các bệnh về mắt')]},
{t:'III.5 Tai - Mũi - Họng',f:[['ttt','Tai trái: nói thường (m)','num'],['ttth','Tai trái: nói thầm (m)','num'],['tpt','Tai phải: nói thường (m)','num'],['tpth','Tai phải: nói thầm (m)','num'],...pr('tmhb','Các bệnh về tai mũi họng')]},
{t:'III.6 Răng - Hàm - Mặt',f:[['ht','Hàm trên','text'],['hd','Hàm dưới','text'],...pr('rhm','Các bệnh về răng hàm mặt')]},
{t:'IV. Cận lâm sàng',f:[['cls_txt','Kết quả cận lâm sàng (xét nghiệm máu, nước tiểu, XQ tim phổi, khác)','area']]},
{t:'V. Kết luận',f:[['date','Ngày khám','date'],['kl','1. Tình trạng sức khoẻ; mắc các bệnh, tật (nếu có)','area'],['cls','2. Phân loại sức khoẻ','cls']]}];
const CC={I:'#1a9e6a',II:'#5bbf4a',III:'#f0b429',IV:'#f07a29',V:'#d64545','':'#b8c4d6'},CL=['I','II','III','IV','V'];
let S;try{S=JSON.parse(localStorage.bvth)}catch(e){}
if(!S||!S.people)S={people:SEED,exams:{},schema:DEF,depts:DEPTS,year:2026};
let V='dash',F={d:'',q:'',s:'',pg:0},D=null,CUR=null;
const save=()=>{try{localStorage.bvth=JSON.stringify(S)}catch(e){toast('Không lưu được: bộ nhớ trình duyệt đầy')}},toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const db=new Promise((r,j)=>{const q=indexedDB.open('bvth',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=j});
const idb=(m,...a)=>db.then(d=>new Promise((r,j)=>{const q=d.transaction('f',m=='get'?'readonly':'readwrite').objectStore('f')[m](...a);q.onsuccess=()=>r(q.result);q.onerror=j}));
const dm=d=>d&&d.includes('-')?d.split('-').reverse().join('/'):d||'',ex=(id,y=S.year)=>S.exams[id+'|'+y],P=id=>S.people.find(p=>p.id==id);
const age=(dob,at)=>{if(!dob)return'';const b=new Date(dob),n=at?new Date(at):new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const bmi=(c,n)=>c>0&&n>0?+(n/((c/100)**2)).toFixed(1):'';
const bc=b=>!b?'Chưa có':b<18.5?'Gầy':b<23?'Bình thường':b<25?'Thừa cân':'Béo phì';
const pl=c=>`<span class="pl" style="background:${CC[c||'']}">${c||'—'}</span>`;
const yrs=()=>{const a=[];for(let y=2024;y<=new Date().getFullYear()+1;y++)a.push(y);if(!a.includes(S.year))a.push(S.year);return a};
function setV(v){V=v;render()}
function render(){
$('#nav').innerHTML=[['dash','Tổng quan'],['list','Cán bộ'],['set','Cài đặt']].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="setV('${k}')">${l}</button>`).join('');
$('#m').innerHTML=V=='dash'?dash():V=='list'?list():sett()}
const yearSel=()=>`<select style="max-width:130px" onchange="S.year=+this.value;save();render()">${yrs().map(y=>`<option ${y==S.year?'selected':''} value="${y}">Năm ${y}</option>`).join('')}</select>`;
/* charts */
function donut(a){const t=a.reduce((s,x)=>s+x.v,0)||1;let o=0;const R=52,C=2*Math.PI*R;return`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg width="150" height="150" viewBox="0 0 140 140"><g transform="rotate(-90 70 70)">${a.map(x=>{const l=x.v/t*C,s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${x.c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</g><text x="70" y="75" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${a.reduce((s,x)=>s+x.v,0)}</text></svg><div class="lg" style="flex-direction:column">${a.map(x=>`<span style="--c:${x.c}">${x.l}: <b>${x.v}</b></span>`).join('')}</div></div>`}
const bars=(rows,leg)=>rows.map(r=>{const t=r.s.reduce((a,x)=>a+x.v,0)||1;return`<div class="bh"><i title="${E(r.l)}">${E(r.l)}</i><div>${r.s.map(x=>`<u style="width:${x.v/(r.max||t)*100}%;background:${x.c}" title="${x.l}: ${x.v}"></u>`).join('')}</div><b>${r.n??t}</b></div>`}).join('')+(leg?`<div class="lg">${leg.map(x=>`<span style="--c:${x.c}">${x.l}</span>`).join('')}</div>`:'');
function dash(){const Y=S.year,ps=S.people,done=ps.filter(p=>ex(p.id));const cnt={};CL.forEach(c=>cnt[c]=0);let unc=0;done.forEach(p=>{const c=ex(p.id).cls;c in cnt?cnt[c]++:unc++});
const pc=[...CL.map(c=>({l:'Loại '+c,v:cnt[c],c:CC[c]})),{l:'Chưa phân loại',v:unc,c:CC['']}].filter(x=>x.v);
const dr=S.depts.map(d=>{const m=ps.filter(p=>p.dept==d),s=CL.map(c=>({l:c,c:CC[c],v:m.filter(p=>ex(p.id)?.cls==c).length}));const k=m.filter(p=>ex(p.id)).length;s.push({l:'Chưa khám',c:CC[''],v:m.length-k});return{l:d.replace(/^\d+\.\s*/,''),s,n:`${k}/${m.length}`,max:m.length}}).filter(r=>r.max);
const bm={};done.forEach(p=>{const e=ex(p.id),k=bc(bmi(+e.cao,+e.nang));bm[k]=(bm[k]||0)+1});
const bcol={'Gầy':'#5aa9e6','Bình thường':'#1a9e6a','Thừa cân':'#f0b429','Béo phì':'#d64545','Chưa có':'#b8c4d6'};
const ag={};ps.forEach(p=>{const a=age(p.dob),k=a<30?'<30':a<40?'30-39':a<50?'40-49':'≥50';ag[k]=(ag[k]||0)+1});
const ds=S.schema.flatMap(s=>s.f).filter(f=>/^h\d+$/.test(f[0])).map(f=>({l:f[1].replace(/^2\.\d+\s/,''),n:done.filter(p=>ex(p.id)[f[0]]=='Có').length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,8);
const nam=ps.filter(p=>p.sex=='Nam').length;
return`<div class="row"><h2 style="margin:0">Tổng quan sức khoẻ cán bộ</h2>${yearSel()}</div>
<div class="kp"><div class="k"><b>${ps.length}</b><span>Tổng cán bộ</span></div><div class="k"><b>${done.length}</b><span>Đã khám năm ${Y}</span></div><div class="k" style="border-color:#f0b429"><b>${ps.length-done.length}</b><span>Chưa khám</span></div><div class="k" style="border-color:#1a9e6a"><b>${ps.length?Math.round(done.length/ps.length*100):0}%</b><span>Tỷ lệ hoàn thành</span></div><div class="k"><b>${nam}/${ps.length-nam}</b><span>Nam / Nữ</span></div></div>
<div class="grid"><div class="card"><h2>Phân loại sức khoẻ năm ${Y}</h2>${donut(pc.length?pc:[{l:'Chưa có dữ liệu',v:0,c:CC['']}])}</div>
<div class="card"><h2>Chỉ số BMI</h2>${bars(Object.keys(bm).map(k=>({l:k,s:[{l:k,c:bcol[k],v:bm[k]}],max:done.length})))||'Chưa có dữ liệu'}</div>
<div class="card"><h2>Cơ cấu độ tuổi</h2>${bars(['<30','30-39','40-49','≥50'].map(k=>({l:k,s:[{l:k,c:'#1e88e5',v:ag[k]||0}],max:ps.length})))}</div>
<div class="card"><h2>Bệnh/tình trạng thường gặp (tiền sử "Có")</h2>${ds.length?bars(ds.map(x=>({l:x.l,s:[{l:x.l,c:'#f07a29',v:x.n}],max:done.length}))):'Chưa có dữ liệu'}</div></div>
<div class="card"><h2>Theo khoa phòng (đã khám / tổng)</h2>${bars(dr,[...CL.map(c=>({l:'Loại '+c,c:CC[c]})),{l:'Chưa khám',c:CC['']}])}</div>`}
function list(){const Y=S.year;let ps=S.people.filter(p=>(!F.d||p.dept==F.d)&&(!F.q||(p.name+p.cccd).toLowerCase().includes(F.q.toLowerCase()))&&(!F.s||(F.s=='x'?!ex(p.id):F.s=='k'?!!ex(p.id):ex(p.id)?.cls==F.s)));
let h='',last;ps.forEach((p,i)=>{if(p.dept!=last){last=p.dept;h+=`<tr class="dp"><td colspan="7">${E(p.dept)}</td></tr>`}const e=ex(p.id);h+=`<tr><td>${i+1}</td><td><a href="#" onclick="prof('${p.id}');return false">${E(p.name)}</a></td><td>${dm(p.dob)}</td><td>${p.sex}</td><td>${e?dm(e.date)||'Đã nhập':'<span style="color:var(--mu)">Chưa khám</span>'}</td><td>${e?pl(e.cls):''}</td><td style="white-space:nowrap"><button class="btn s" onclick="edit('${p.id}')">${e?'Sửa':'Nhập'} phiếu</button> <button class="btn s g" onclick="prof('${p.id}')">Hồ sơ</button></td></tr>`});
if(!S.people.length)h='<tr><td colspan="7">Chưa có cán bộ. Vào Cài đặt > Nhập danh sách cán bộ (.csv), hoặc bấm + Thêm cán bộ.</td></tr>';
return`<div class="row"><h2 style="margin:0">Danh sách cán bộ (${ps.length})</h2>${yearSel()}</div><div class="card"><div class="bar"><select onchange="F.d=this.value;render()"><option value="">Tất cả khoa phòng</option>${S.depts.map(d=>`<option ${F.d==d?'selected':''}>${E(d)}</option>`).join('')}</select><input placeholder="Tìm tên / CCCD" value="${E(F.q)}" onchange="F.q=this.value;render()"><select onchange="F.s=this.value;render()">${[['','Mọi trạng thái'],['k','Đã khám'],['x','Chưa khám'],...CL.map(c=>[c,'Loại '+c])].map(([v,l])=>`<option value="${v}" ${F.s==v?'selected':''}>${l}</option>`).join('')}</select><button class="btn" onclick="addP()">+ Thêm cán bộ</button><button class="btn g" onclick="csv()">Xuất CSV năm ${Y}</button></div><div class="tw"><table><tr><th>#</th><th>Họ và tên</th><th>Ngày sinh</th><th>Giới</th><th>Ngày khám ${Y}</th><th>Phân loại</th><th></th></tr>${h}</table></div></div>`}
/* modal */
const open=h=>{$('#md').innerHTML=h;$('#mo').classList.add('on');$('#mo').scrollTop=0},shut=()=>$('#mo').classList.remove('on');
const gv=k=>k.startsWith('p.')?P(CUR)[k.slice(2)]:D[k];
function field(f){const[k,l,t]=f,v=gv(k)??'';let i;
if(t=='area')return`<div class="w"><label>${E(l)}</label><textarea rows="3" data-k="${k}">${E(v)}</textarea></div>`;
if(t=='yn')i=`<select data-k="${k}"><option ${v!='Có'?'selected':''}>Không</option><option ${v=='Có'?'selected':''}>Có</option></select>`;
else if(t=='cls')i=`<select data-k="${k}">${['',...CL].map(c=>`<option ${v==c?'selected':''}>${c}</option>`).join('')}</select>`;
else if(t=='sex')i=`<select data-k="${k}">${['Nam','Nữ'].map(c=>`<option ${v==c?'selected':''}>${c}</option>`).join('')}</select>`;
else if(t=='auto')i=`<input readonly id="age" value="${age(P(CUR).dob,D.date)}">`;
else if(t=='bmi')i=`<input readonly id="bmi" value="${bmi(+D.cao,+D.nang)}">`;
else i=`<input data-k="${k}" type="${t=='num'?'number':t=='date'?'date':'text'}" step="any" value="${E(v)}">`;
return`<div><label>${E(l)}</label>${i}</div>`}
function edit(id){CUR=id;D=JSON.parse(JSON.stringify(ex(id)||{date:new Date().toISOString().slice(0,10),att:[]}));D.att=D.att||[];
open(`<div class="row"><h2>Giấy khám sức khoẻ định kỳ năm ${S.year}</h2><button class="btn g" onclick="shut()">Đóng</button></div>${S.schema.map(s=>`<h3>${E(s.t)}</h3><div class="fg">${s.f.map(field).join('')}</div>`).join('')}
<h3>Tệp đính kèm làm bằng chứng đợt khám ${S.year}</h3><input type="file" multiple onchange="attach(this.files)"><div id="att"></div>
<div class="row" style="margin-top:14px"><span>${ex(id)?'<button class="btn r" onclick="delEx()">Xoá phiếu năm này</button>':''}</span><button class="btn" onclick="saveEx()">Lưu phiếu khám</button></div>`);atts()}
$('#md').addEventListener('input',e=>{const k=e.target.dataset?.k;if(!k)return;if(k.startsWith('p.'))P(CUR)[k.slice(2)]=e.target.value;else D[k]=e.target.value;if($('#bmi'))$('#bmi').value=bmi(+D.cao,+D.nang);if($('#age'))$('#age').value=age(P(CUR).dob,D.date)});
async function attach(fs){for(const f of fs){const id='f'+Date.now()+Math.random().toString(36).slice(2,6);await idb('put',f,id);D.att.push({id,n:f.name,z:Math.round(f.size/1024)})}atts()}
function atts(){$('#att').innerHTML=D.att.map((a,i)=>`<div class="bh"><a href="#" onclick="dl('${a.id}','${E(a.n)}');return false">📎 ${E(a.n)}</a> <span>${a.z} KB</span><button class="btn s r" onclick="D.att.splice(${i},1);atts()">Xoá</button></div>`).join('')}
async function dl(id,n){const b=await idb('get',id);if(!b)return toast('Không tìm thấy tệp');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.target='_blank';a.download=n;a.click()}
function saveEx(){S.exams[CUR+'|'+S.year]=D;save();shut();render();toast('Đã lưu phiếu khám')}
function delEx(){if(confirm('Xoá phiếu khám năm '+S.year+'?')){delete S.exams[CUR+'|'+S.year];save();shut();render()}}
function prof(id){const p=P(id);const hs=yrs().map(y=>({y,e:ex(id,y)})).filter(x=>x.e);
const ch=(k,n,f)=>{const pts=hs.map(x=>({y:x.y,v:f(x.e)})).filter(x=>x.v);if(pts.length<1)return'';const mx=Math.max(...pts.map(x=>x.v))*1.05,mn=Math.min(...pts.map(x=>x.v))*.95,X=i=>30+(pts.length>1?i*(300/(pts.length-1)):150),Yy=v=>90-(mx==mn?.5:(v-mn)/(mx-mn))*70;return`<div><b style="font-size:13px">${n}</b><svg viewBox="0 0 360 110" width="100%"><polyline fill="none" stroke="#1e88e5" stroke-width="2.5" points="${pts.map((x,i)=>X(i)+','+Yy(x.v)).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Yy(x.v)}" r="4" fill="#1e88e5"/><text x="${X(i)}" y="${Yy(x.v)-8}" font-size="11" text-anchor="middle" fill="currentColor">${x.v}</text><text x="${X(i)}" y="106" font-size="10" text-anchor="middle" fill="currentColor">${x.y}</text>`).join('')}</svg></div>`};
open(`<div class="row"><h2>${E(p.name)} · ${E(p.dept)}</h2><span><button class="btn g" onclick="editP('${id}')">Sửa thông tin</button> <button class="btn g" onclick="shut()">Đóng</button></span></div><p style="color:var(--mu)">${p.sex} · sinh ${dm(p.dob)} (${age(p.dob)} tuổi) · CCCD ${E(p.cccd)} · ĐT ${E(p.phone||'')}</p>
<div class="grid">${ch('n','Cân nặng (kg)',e=>+e.nang)||''}${ch('b','BMI',e=>bmi(+e.cao,+e.nang))}${ch('m','Mạch (lần/phút)',e=>+e.mach)}${ch('h','Huyết áp tâm thu',e=>parseInt(e.ha)||0)}</div>
<h3>Lịch sử khám</h3><div class="tw"><table><tr><th>Năm</th><th>Ngày</th><th>Phân loại</th><th>Kết luận</th><th>Tệp</th><th></th></tr>${hs.map(x=>`<tr><td>${x.y}</td><td>${dm(x.e.date)}</td><td>${pl(x.e.cls)}</td><td>${E(x.e.kl)}</td><td>${(x.e.att||[]).map(a=>`<a href="#" onclick="dl('${a.id}','${E(a.n)}');return false">📎 ${E(a.n)}</a>`).join('<br>')}</td><td><button class="btn s" onclick="S.year=${x.y};save();edit('${id}')">Mở</button></td></tr>`).join('')||'<tr><td colspan="6">Chưa có dữ liệu khám.</td></tr>'}</table></div><p><button class="btn" onclick="edit('${id}')">Nhập/sửa phiếu năm ${S.year}</button></p>`)}
function editP(id){CUR=id;const p=P(id);open(`<div class="row"><h2>Thông tin cán bộ</h2><button class="btn g" onclick="shut()">Đóng</button></div><div class="fg">${[['name','Họ và tên'],['dob','Ngày sinh','date'],['cccd','Số CCCD'],['eth','Dân tộc'],['addr','Nơi ở'],['phone','Điện thoại']].map(([k,l,t])=>`<div><label>${l}</label><input data-k="p.${k}" type="${t||'text'}" value="${E(p[k])}"></div>`).join('')}<div><label>Giới tính</label><select data-k="p.sex"><option ${p.sex=='Nam'?'selected':''}>Nam</option><option ${p.sex=='Nữ'?'selected':''}>Nữ</option></select></div><div><label>Khoa phòng</label><select data-k="p.dept">${S.depts.map(d=>`<option ${p.dept==d?'selected':''}>${E(d)}</option>`).join('')}</select></div></div><div class="row" style="margin-top:14px"><button class="btn r" onclick="delP('${id}')">Xoá cán bộ</button><button class="btn" onclick="save();shut();render()">Lưu</button></div>`)}
function addP(){const p={id:'n'+Date.now(),name:'Cán bộ mới',dob:'',sex:'Nam',cccd:'',eth:'Kinh',addr:'',phone:'',dept:F.d||S.depts[0]};S.people.push(p);editP(p.id)}
function delP(id){if(confirm('Xoá cán bộ này và toàn bộ dữ liệu khám?')){S.people=S.people.filter(p=>p.id!=id);Object.keys(S.exams).forEach(k=>k.startsWith(id+'|')&&delete S.exams[k]);save();shut();render()}}
function csv(){const r=[['STT','Họ tên','Ngày sinh','Giới','Khoa phòng','CCCD','Ngày khám','Cao','Nặng','BMI','Huyết áp','Phân loại','Kết luận']];S.people.forEach((p,i)=>{const e=ex(p.id)||{};r.push([i+1,p.name,dm(p.dob),p.sex,p.dept,"'"+p.cccd,dm(e.date),e.cao,e.nang,bmi(+e.cao,+e.nang),e.ha,e.cls,e.kl])});const b=new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='suc-khoe-can-bo-'+S.year+'.csv';a.click()}
/* settings */
const TY={text:'Văn bản',num:'Số',date:'Ngày',yn:'Có/Không',cls:'Phân loại I-V',area:'Văn bản dài',sex:'Nam/Nữ'};
function sett(){return`<div class="card"><h2>Đề mục giấy khám sức khoẻ (chủ trang chỉnh sửa)</h2><p style="color:var(--mu);margin-top:0">Đổi tên đề mục, thêm/xoá mục, đổi kiểu nhập. Các mục tự tính (tuổi, BMI) và mục lõi dùng cho biểu đồ (chiều cao, cân nặng, phân loại…) nên giữ lại.</p>
${S.schema.map((s,i)=>`<h3><input value="${E(s.t)}" onchange="S.schema[${i}].t=this.value;save()" style="font-weight:700"> <button class="btn s r" onclick="if(confirm('Xoá cả nhóm?')){S.schema.splice(${i},1);save();render()}">Xoá nhóm</button></h3>${s.f.map((f,j)=>f[2]=='auto'||f[2]=='bmi'?'':`<div class="bar" style="margin-bottom:4px"><input style="flex:3 1 260px" value="${E(f[1])}" onchange="S.schema[${i}].f[${j}][1]=this.value;save()"><select onchange="S.schema[${i}].f[${j}][2]=this.value;save()">${Object.entries(TY).map(([k,l])=>`<option value="${k}" ${f[2]==k?'selected':''}>${l}</option>`).join('')}</select><button class="btn s r" onclick="S.schema[${i}].f.splice(${j},1);save();render()">Xoá</button></div>`).join('')}<button class="btn s g" onclick="S.schema[${i}].f.push(['x'+Date.now().toString(36),'Mục mới','text']);save();render()">+ Thêm mục</button>`).join('')}
<p><button class="btn" onclick="S.schema.push({t:'Nhóm mới',f:[]});save();render()">+ Thêm nhóm đề mục</button> <button class="btn g" onclick="if(confirm('Khôi phục đề mục mẫu?')){S.schema=JSON.parse(JSON.stringify(DEF));save();render()}">Khôi phục mẫu</button></p></div>
<div class="card"><h2>Khoa phòng</h2>${S.depts.map((d,i)=>`<div class="bar" style="margin-bottom:4px"><input value="${E(d)}" onchange="renD(${i},this.value)"><button class="btn s r" onclick="delD(${i})">Xoá</button></div>`).join('')}<button class="btn s g" onclick="S.depts.push('Khoa mới');save();render()">+ Thêm khoa phòng</button></div>
<div class="card"><h2>Sao lưu dữ liệu</h2><p style="color:var(--mu);margin-top:0">Dữ liệu lưu trong trình duyệt này. Hãy sao lưu định kỳ và nhập lại khi dùng máy khác (tệp đính kèm không nằm trong bản sao lưu).</p><button class="btn" onclick="bk()">Tải bản sao lưu (.json)</button> <label class="btn g" style="display:inline-block">Nhập danh sách cán bộ (.csv)<input type="file" accept=".csv,text/csv" hidden onchange="impC(this.files[0]);this.value=''"></label> <button class="btn g" onclick="tpl()">Tải CSV mẫu</button> <label class="btn g" style="display:inline-block">Nhập bản sao lưu<input type="file" accept=".json" hidden onchange="rs(this.files[0])"></label></div>`}
function renD(i,v){const o=S.depts[i];S.depts[i]=v;S.people.forEach(p=>p.dept==o&&(p.dept=v));save()}
function delD(i){const d=S.depts[i];if(S.people.some(p=>p.dept==d))return toast('Khoa còn cán bộ, hãy chuyển cán bộ trước');S.depts.splice(i,1);save();render()}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='bvdktuyenhoa-sao-luu.json';a.click()}
function rs(f){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.people)throw 0;S=x;save();render();toast('Đã nhập dữ liệu')}catch(e){toast('Tệp không hợp lệ')}};r.readAsText(f)}
const CH=['CanBoID','HoTen','NgaySinh','GioiTinh','CCCD','DanToc','NoiO','DienThoai','KhoaPhong'];
function tpl(){const b=new Blob(['\ufeff'+CH.join(',')+'\nCB001,Nguyễn Văn A,15/03/1985,Nam,044085000000,Kinh,"Xã Đồng Lê, Tỉnh Quảng Trị",0912345678,1. Ban Lãnh đạo\n'],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mau-danh-sach-can-bo.csv';a.click()}
function csvP(t){t=t.replace(/^\ufeff/,'');const f=t.split(/\r?\n/)[0],D=(f.split(';').length>f.split(',').length)?';':',',r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=x}else if(x=='"')q=1;else if(x==D){row.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=x}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
function impC(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const R=csvP(r.result),h=R[0].map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k.toLowerCase());if(ix('HoTen')<0||ix('KhoaPhong')<0)throw 0;let n=0;R.slice(1).forEach((x,i)=>{const g=k=>(x[ix(k)]||'').trim();if(!g('HoTen'))return;let d=g('NgaySinh');const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d);if(m)d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');const id=g('CanBoID')||'c'+Date.now().toString(36)+i,p={id,name:g('HoTen'),dob:d,sex:/n[ữu]/i.test(g('GioiTinh'))?'Nữ':'Nam',cccd:g('CCCD'),eth:g('DanToc'),addr:g('NoiO'),phone:g('DienThoai'),dept:g('KhoaPhong')},j=S.people.findIndex(y=>y.id==id);j>=0?S.people[j]=p:S.people.push(p);if(p.dept&&!S.depts.includes(p.dept))S.depts.push(p.dept);n++});save();render();toast('Đã nhập '+n+' cán bộ')}catch(e){toast('Tệp CSV không đúng mẫu (cần cột HoTen, KhoaPhong)')}};r.readAsText(f,'utf-8')}
render();
</script></body></html>
